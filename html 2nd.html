const $=id=>document.getElementById(id);
const loadImg=s=>new Promise((r,j)=>{const i=new Image();i.onload=()=>r(i);i.onerror=j;i.src=s;});
// আগে থেকেই target.mind ফাইল নামিয়ে রাখা হয়, যাতে ক্যামেরা সঙ্গে সঙ্গে খোলে
const mindP=fetch('target.mind').then(r=>r.ok?r.blob():null).catch(()=>null);
$('go').onclick=async()=>{
  const st=$('st'); $('go').disabled=true;
  try{
    st.textContent='ক্যামেরা খুলছে...';
    let blob=await mindP;
    if(!blob){
      const C=window.__C||(window.MINDAR&&window.MINDAR.IMAGE&&window.MINDAR.IMAGE.Compiler);
      if(!C) throw new Error('লাইব্রেরি লোড হয়নি, পেজ রিফ্রেশ করুন');
      const t=await loadImg(TARGET); const c=new C();
      await c.compileImageTargets([t],x=>{st.textContent='প্রস্তুত হচ্ছে... '+Math.round(x)+'%';});
      blob=new Blob([await c.exportData()]);
    }
    const mind=URL.createObjectURL(blob);
    const p=await loadImg(PHOTO); const ph=p.height/p.width;
    $('start').style.display='none'; $('arWrap').style.display='block'; $('load').style.display='block';
    $('arWrap').innerHTML=`<a-scene mindar-image="imageTargetSrc: ${mind}; uiLoading: no; uiScanning: no; uiError: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false"><a-camera position="0 0 0" look-controls="enabled: false"></a-camera><a-entity mindar-image-target="targetIndex: 0"><a-image src="${PHOTO}" position="0 0 0.05" width="0.9" height="${0.9*ph}" animation="property: position; to: 0 0 0.12; dir: alternate; dur: 1400; easing: easeInOutSine; loop: true"></a-image></a-entity></a-scene>`;
    const sc=document.querySelector('a-scene');
    sc.addEventListener('arReady',()=>{$('load').style.display='none';$('hint').style.display='block';});
    sc.addEventListener('arError',()=>{$('load').textContent='ক্যামেরা চালু হয়নি। Safari তে খুলে অনুমতি দিন।';});
  }catch(e){st.textContent='সমস্যা: '+(e.message||e); $('go').disabled=false;}
};
</script></body></html>
